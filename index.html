<div class="ofgf-mini-nav">
  <style>
    .ofgf-mini-nav {
      --ink:#111; --cream:#fff8dc; --yellow:#ffd900; --red:#e12727;
      max-width:820px; margin:24px auto; padding:18px;
      border:3px solid var(--ink); background:var(--cream);
      font-family:Arial, sans-serif; box-shadow:5px 5px 0 var(--ink);
      position:relative; overflow:hidden;
    }

    .ofgf-mini-nav:before {
      content:"✦ ★ ✧ ✦ ★ ✧ ✦";
      position:absolute; top:10px; right:14px;
      color:var(--red); letter-spacing:5px; font-size:14px;
      animation:ofgfSparkle 1.2s infinite alternate;
    }

    @keyframes ofgfSparkle {
      from {opacity:.3; transform:translateY(0);}
      to {opacity:1; transform:translateY(-2px);}
    }

    .ofgf-logo {
      display:block; max-width:300px; width:100%; height:auto;
      margin-bottom:10px; transition:.2s;
      filter:drop-shadow(3px 3px 0 #111);
    }

    .ofgf-logo:hover { transform:rotate(-1deg) scale(1.03); }

    .ofgf-mini-sub {
      display:inline-block; margin:0 0 14px;
      background:#111; color:#fff; padding:6px 10px;
      font-size:11px; font-weight:900; letter-spacing:1px;
      text-transform:uppercase;
    }

    .ofgf-mini-grid {
      display:grid; grid-template-columns:repeat(5,1fr); gap:8px;
      margin-bottom:12px;
    }

    .ofgf-mini-grid a,
    .ofgf-mini-random {
      border:2px solid var(--ink); background:#fffdf4; color:var(--ink);
      text-decoration:none; padding:11px 8px; font-size:11px;
      font-weight:900; text-align:center; box-shadow:3px 3px 0 var(--ink);
      cursor:pointer; transition:.15s; text-transform:uppercase; line-height:1.25;
    }

    .ofgf-mini-grid a:hover,
    .ofgf-mini-random:hover {
      background:var(--yellow); transform:translate(2px,2px);
      box-shadow:1px 1px 0 var(--ink);
    }

    .ofgf-mini-grid span {
      display:block; font-size:19px; margin-bottom:3px;
    }

    .ofgf-feature-row {
      display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:8px;
      margin-top:10px;
    }

    .ofgf-feature {
      display:block; text-decoration:none; color:#111;
      border:2px dashed #111; background:#fffdf4;
      padding:10px; font-size:12px; font-weight:800;
      line-height:1.35; transition:.15s;
    }

    .ofgf-feature strong {
      display:block; font-family:"Arial Black", Arial, sans-serif;
      font-size:13px; color:var(--red); text-transform:uppercase;
      margin-bottom:3px;
    }

    .ofgf-feature:hover {
      background:#111; color:#fff; border-style:solid;
    }

    .ofgf-feature:hover strong { color:var(--yellow); }

    .ofgf-mini-result {
      margin-top:12px; padding:10px 12px;
      border:2px solid var(--ink); background:#111; color:#fff;
      font-size:12px; font-weight:800; display:none; line-height:1.5;
      box-shadow:3px 3px 0 var(--red);
    }

    .ofgf-mini-result a {
      color:var(--yellow); font-weight:900;
    }

    .ofgf-tiny-note {
      margin-top:12px; font-size:11px; font-weight:900;
      text-transform:uppercase; letter-spacing:.7px;
    }

    @media (max-width:700px) {
      .ofgf-mini-grid { grid-template-columns:repeat(2,1fr); }
      .ofgf-feature-row { grid-template-columns:1fr; }
      .ofgf-logo { max-width:230px; }
    }
  </style>

  <img class="ofgf-logo" src="YOUR-LOGO-URL-HERE" alt="OfficialGF Logo">

  <div class="ofgf-mini-sub">click around the japanese music internet</div>

  <div class="ofgf-mini-grid">
    <a href="/blog/"><span>★</span>New Finds</a>
    <a href="/scene-map/"><span>⌖</span>Scene Map</a>
    <a href="/playlists/"><span>♫</span>Playlists</a>
    <a href="/live-reports/"><span>▣</span>Live Reports</a>
    <button class="ofgf-mini-random" onclick="ofgfMiniRandom()"><span>✦</span>Random</button>
  </div>

  <div class="ofgf-feature-row">
    <a class="ofgf-feature" href="/scene-map/">
      <strong>Start Here</strong>
      Walk through Tokyo’s live house neighborhoods.
    </a>

    <a class="ofgf-feature" href="/playlists/">
      <strong>OFGF Radio</strong>
      Pick a playlist and disappear.
    </a>

    <a class="ofgf-feature" href="/category/artist-deep-dives/">
      <strong>Deep Dives</strong>
      For artist rabbit holes.
    </a>
  </div>

  <div class="ofgf-mini-result" id="ofgf-mini-result"></div>

  <div class="ofgf-tiny-note">
    ✧ one click = one new obsession ✧
  </div>

  <script>
    const ofgfMiniLinks = [
      { title:"Tokyo Live House Scene Map", url:"/scene-map/" },
      { title:"OFGF Playlists", url:"/playlists/" },
      { title:"New Japanese Music Finds", url:"/blog/" },
      { title:"Live Reports", url:"/live-reports/" },
      { title:"Artist Deep Dives", url:"/category/artist-deep-dives/" },
      { title:"Vocaloid + Internet Music", url:"/category/vocaloid/" }
    ];

    function ofgfMiniRandom() {
      const pick = ofgfMiniLinks[Math.floor(Math.random() * ofgfMiniLinks.length)];
      const result = document.getElementById("ofgf-mini-result");
      result.style.display = "block";
      result.innerHTML = `✦ Random rabbit hole: <a href="${pick.url}">${pick.title} →</a>`;
    }
  </script>
</div>
